name: Portable download packages (alpha)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*-alpha.*'
permissions:
  contents: read
jobs:
  portable:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Linux browser OS dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Validate syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Build self-contained runtime folder
        run: node scripts/build-portable.js
      - name: Verify bundled Node and browser against local HTTP
        run: node scripts/test-portable.js
      - name: Compress Windows portable folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          $folder = Get-ChildItem dist -Directory | Select-Object -First 1
          $shortSha = $env:GITHUB_SHA.Substring(0,7)
          Compress-Archive -Path $folder.FullName -DestinationPath "release/$($folder.Name)-$shortSha.zip"
      - name: Compress Linux/macOS portable folder
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          folder="$(basename dist/*)"
          tar -C dist -czf "release/${folder}-${GITHUB_SHA:0:7}.tar.gz" "$folder"
      - name: Generate SHA-256 checksums
        run: node scripts/checksums.js
      - name: Upload temporary build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: release/*
          retention-days: 14
          if-no-files-found: error

  publish-prerelease:
    # All three OS packages and browser smoke tests must pass. Main pushes
    # create immutable-per-commit DEV prereleases. Manual builds do not publish.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release
          merge-multiple: true
      - name: Verify all three platform archives before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          for sums in release/*.sha256; do
            (cd release && sha256sum -c "$(basename "$sums")")
          done
      - name: Automatically publish development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag="dev-${GITHUB_SHA:0:7}"
            label="Development snapshot"
          else
            tag="$GITHUB_REF_NAME"
            label="Versioned alpha"
          fi
          notes="Unsigned Breakpoint Doctor portable downloads for Windows, Linux and macOS.
          Source commit: ${GITHUB_SHA}
          Development snapshots are generated automatically after all three platform builds and smoke tests pass.
          No Git clone, Node.js installation or separate browser download is needed.
          Verify the .sha256 checksums before extracting.
          This is an alpha developer tool and is not a signed or certified desktop application.
          See docs/PORTABLE_DOWNLOADS.md in the repository for instructions."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving existing verified assets unchanged."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Breakpoint Doctor $label (${GITHUB_SHA:0:7})" \
              --notes "$notes" --prerelease
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Breakpoint Doctor $label ($tag)" \
              --notes "$notes" --prerelease --verify-tag
          fi
