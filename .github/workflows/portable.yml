name: Portable download packages (alpha)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable.yml'
      - 'scripts/build-portable.js'
      - 'scripts/test-portable.js'
      - 'scripts/checksums.js'
      - 'scripts/scan-website.mjs'
      - 'src/doctor.js'
    tags:
      - 'v*-alpha.*'
permissions:
  contents: read
jobs:
  portable:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Linux browser OS dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Validate source before packaging
        run: npm run check
      - name: Build self-contained runtime folder
        run: node scripts/build-portable.js
      - name: Verify bundled Node and browser against local HTTP
        run: node scripts/test-portable.js
      - name: Compress Windows portable folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          $folder = Get-ChildItem dist -Directory | Select-Object -First 1
          Compress-Archive -Path $folder.FullName -DestinationPath "release/$($folder.Name).zip"
      - name: Compress Linux/macOS portable folder
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          folder="$(basename dist/*)"
          tar -C dist -czf "release/${folder}.tar.gz" "$folder"
      - name: Generate SHA-256 checksums
        run: node scripts/checksums.js
      - name: Upload unsigned alpha packages for review
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: release/*
          retention-days: 14
          if-no-files-found: error

  publish-prerelease:
    # Creating/pushing the tag is the owner's explicit publication action.
    # Branch pushes and manual test builds NEVER publish anything.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release
          merge-multiple: true
      - name: Publish unsigned alpha GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Breakpoint Doctor $GITHUB_REF_NAME (alpha)" \
            --notes "Unsigned portable alpha distributions. Verify .sha256 files before use. No cloning or Node installation required. See docs/PORTABLE_DOWNLOADS.md. Not production-certified." \
            --prerelease --verify-tag
